# Overlay only: notes, cancellations, estimated sprint flags, last-resort
# fallbacks. Runtime calendar always prefers FastF1 + OpenF1.

notes:
  "2024-3":
    - "Carlos Sainz withdrew before qualifying (appendicitis). Oliver Bearman substituted in the Ferrari."
    - "First Chinese GP since 2019 is round 5, not this round."
  "2024-5":
    - "First Chinese Grand Prix since 2019. Sprint weekend."
  "2024-14":
    - "Max Verstappen received a 10-place grid penalty. Highlight in qualifying result."
  "2026-15":
    - "2026 Dutch Grand Prix at Zandvoort. New 2026 technical regulations (MGU-H removed)."
    - "Isack Hadjar withdrew (injury). Liam Lawson is at Red Bull (promoted from Racing Bulls). Yuki Tsunoda replaces Hadjar at Racing Bulls."
    - "ARIS focus car is Lewis Hamilton. Strategy uses 2021–2025 Zandvoort races, not Hamilton's real pit calls."

# Drivers who must not appear on the live/replay map for a weekend.
weekend_lineups:
  "2026-15":
    exclude: ["HAD"]

cancelled:
  "2026-2": "2026 Bahrain Grand Prix cancelled"
  "2026-3": "2026 Saudi Arabian Grand Prix cancelled"
  "2026-7": "2026 Emilia Romagna Grand Prix cancelled (Imola dropped from the 2026 FIA calendar)"

