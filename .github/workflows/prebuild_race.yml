name: prebuild-race-r2

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild all races, ignoring already-built R2 files (use after a ghost/ranking algorithm change)"
        type: boolean
        default: false
  schedule:
    # Monday 18:00 UTC — every race Sunday has ended by Monday morning.
    - cron: "0 18 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/prebuild_race_r2.py"
      - "deploy/r2_upload.py"
      # A change to the ghost simulation/ranking or the physics model changes
      # what every already-built ghost_*.json *should* contain. Without this,
      # --skip-existing (below) silently keeps serving stale, pre-fix data —
      # this is exactly how the Miami 2026 P23 ghost-position bug shipped.
      - "src/aris/ghost.py"
      - "src/aris/explain/ghost.py"
      - "src/aris/simulate.py"
      - ".github/workflows/prebuild_race.yml"

jobs:
  prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install script dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastf1 boto3 pandas numpy pydantic sqlalchemy \
            "psycopg[binary]" python-dotenv scikit-learn pyyaml httpx diskcache requests

      - name: Prebuild completed races
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ARIS_DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # --skip-existing is only safe for the routine weekly/push run (new
          # races only). A manual force run (workflow_dispatch, force=true)
          # drops it so every race is rebuilt from the current ghost/ranking
          # and physics code — required after a change to src/aris/ghost.py
          # or src/aris/simulate.py, since --skip-existing would otherwise
          # keep serving stale pre-fix ghost_*.json forever.
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force rebuild requested — ignoring already-built R2 files."
            python scripts/prebuild_race_r2.py --all-completed
          else
            python scripts/prebuild_race_r2.py --all-completed --skip-existing
          fi

      - name: Upload any remaining local JSON
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python deploy/r2_upload.py --path replay/ || true
