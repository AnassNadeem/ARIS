name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --extra dev
      # Fail on new Ruff findings. Existing backlog is snapshotted in ruff-baseline.json.
      - run: uv run python scripts/check_ruff_baseline.py
      # Deselected tests — bounded, known gaps (not neglect):
      # test_zandvoort_identity_flag_off — recommend() identity lock ("Pit lap 33 for HARD"); needs gitignored models/residual_xgb.json
      # test_predicted_increases_with_age_after_outlap — bicycle predicted_deg monotonicity needs a FastF1-backed explain session
      # test_zandvoort_identity_with_flag_on_no_field — same residual identity lock as the flag-off ranking test
      # test_ghost_and_real_pit_counts_match_sample_races — FastF1 session ticks for VER/NOR/PIA; synthetic bundle is not enough
      # test_ver_zandvoort_ghost_position_anchored_to_real_and_delta — FastF1-backed ghost ticks with a non-zero cumulative delta
      # test_zandvoort_identity_with_measured_flag_on — same residual identity lock plus measured SC pit-loss table
      - run: >
          uv run pytest -v
          --cov=src/aris
          --cov=backend
          --cov-report=xml
          --cov-report=term
          --deselect tests/test_circuit_deg.py::test_zandvoort_identity_flag_off
          --deselect tests/test_degradation_curve.py::test_predicted_increases_with_age_after_outlap
          --deselect tests/test_field_undercut.py::test_zandvoort_identity_with_flag_on_no_field
          --deselect tests/test_ghost_vs_real.py::test_ghost_and_real_pit_counts_match_sample_races
          --deselect tests/test_ghost_vs_real.py::test_ver_zandvoort_ghost_position_anchored_to_real_and_delta
          --deselect tests/test_sc_pit_loss.py::test_zandvoort_identity_with_measured_flag_on
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate", 0))
          pct = round(line_rate * 100, 1)
          print(f"Line coverage: {pct}%")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"## Coverage\n\nLine coverage (`src/aris` + `backend`): **{pct}%**\n")
          PY
          fi
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      # LayoutProps / typed routes live in .next/types; tsc on a cold checkout
      # needs typegen (next build also writes them, but CI only typechecks).
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build:static
        env:
          NEXT_PUBLIC_API_BASE: https://example.herokuapp.com
          NEXT_PUBLIC_R2_BASE_URL: https://pub-9429cde26be84c4c8034f0b5873b9a7d.r2.dev
