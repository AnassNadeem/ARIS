[project]
name = "aris"
version = "0.1.0"
description = "Always-on race-strategy AI: hybrid physics + residual ML + LLM narration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anass Nadeem" }]
keywords = ["formula-1", "race-strategy", "machine-learning", "fastf1"]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "fastf1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "plotly>=5.24",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "faiss-cpu>=1.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "diskcache>=5.6",
    "signalrcore>=0.9",
    "requests>=2.31",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyterlab",
    "nbconvert",
]
cql = [
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aris"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "learning", ".venv", "fastf1_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = [
    "integration: needs a live Postgres; skipped in CI (no ARIS_DB_URL set)",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
